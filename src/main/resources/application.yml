spring:
  application:
    name: station-search-api
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        concurrency: 4
        max-concurrency: 8
        prefetch: 25

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  messaging:
    rabbit:
      retry:
        max-retries: 2
        initial-interval: 500ms
        multiplier: 2.0
        max-interval: 2s

      exchange:
        name: energy.snapshot.events
        type: topic
        durable: true

      dlx:
        name: energy.snapshot.events.dlx

      queues:
        - name: station.snapshot.ingestion.queue
          dlq: station.snapshot.ingestion.dlq
          bindings:
            - energy.snapshot.fuel.*.created
