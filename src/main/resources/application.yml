spring:
  application:
    name: station-search-api

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    listener:
      simple:
        default-requeue-rejected: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:station_search}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        order_inserts: ${HIBERNATE_ORDER_INSERTS:true}
        order_updates: ${HIBERNATE_ORDER_UPDATES:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces

  otlp:
    metrics:
      export:
        enabled: false

logging:
  include-application-name: false
  structured:
    format:
      console: logstash

app:
  seo:
    sitemap:
      cache-ttl: ${SITEMAP_CACHE_TTL:PT1H}
  observability:
    search:
      paths:
        - /stations
        - /locations
  messaging:
    rabbit:
      consumer:
        snapshot:
          concurrency: ${SNAPSHOT_CONCURRENCY:8}
          max-concurrency: ${SNAPSHOT_MAX_CONCURRENCY:16}
          prefetch: ${SNAPSHOT_PREFETCH:100}
        completion:
          concurrency: ${COMPLETION_CONCURRENCY:1}
          prefetch: ${COMPLETION_PREFETCH:1}
      retry:
        max-retries: 2
        initial-interval: 500ms
        multiplier: 2.0
        max-interval: 2s

      exchange:
        name: energy.snapshot.events
        type: topic
        durable: true

      dlx:
        name: energy.snapshot.events.dlx

      queues:
        - name: station.snapshot.ingestion.queue
          dlq: station.snapshot.ingestion.dlq
          bindings:
            - energy.snapshot.fuel.*.created
        - name: station.snapshot.completed.queue
          dlq: station.snapshot.completed.dlq
          bindings:
            - energy.snapshot.completed
