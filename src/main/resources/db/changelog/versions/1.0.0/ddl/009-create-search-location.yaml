databaseChangeLog:

  - changeSet:
      id: 009-create-search-location
      author: jorge

      changes:

        - createTable:
            tableName: search_location

            columns:

              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: country_code
                  type: varchar(2)
                  constraints:
                    nullable: false

              - column:
                  name: postal_code
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: normalized_postal_code
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: locality_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: location
                  type: geography(Point,4326)
                  constraints:
                    nullable: false

              - column:
                  name: accuracy
                  type: smallint

              - column:
                  name: source
                  type: varchar(30)
                  defaultValue: GEONAMES
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            tableName: search_location
            indexName: idx_search_location_country_postal_code
            columns:
              - column:
                  name: country_code
              - column:
                  name: normalized_postal_code

        - createIndex:
            tableName: search_location
            indexName: idx_search_location_locality
            columns:
              - column: {name: locality_id}

        - sql:
            sql: >
              CREATE INDEX idx_search_location_location
              ON search_location
              USING GIST (location);
        - addForeignKeyConstraint:
            baseTableName: search_location
            baseColumnNames: locality_id
            referencedTableName: geographic_area
            referencedColumnNames: id
            constraintName: fk_search_location_locality
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE search_location ADD CONSTRAINT ck_search_location_accuracy CHECK (accuracy IS NULL OR accuracy BETWEEN 0 AND 10);
        - sql:
            sql: CREATE INDEX idx_geographic_area_name_trgm ON geographic_area USING GIN (normalized_name gin_trgm_ops);
