databaseChangeLog:
  - changeSet:
      id: 013-create-station-import-progress
      author: codex
      changes:
        - createTable:
            tableName: station_import_progress
            columns:
              - column:
                  name: snapshot_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: shard
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: processed_stations
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: station_import_progress
            columnNames: snapshot_id, shard
            constraintName: pk_station_import_progress
        - addForeignKeyConstraint:
            baseTableName: station_import_progress
            baseColumnNames: snapshot_id
            referencedTableName: station_import
            referencedColumnNames: snapshot_id
            constraintName: fk_station_import_progress_import
            onDelete: CASCADE
        - sql:
            sql: >-
              ALTER TABLE station_import_progress
              ADD CONSTRAINT chk_station_import_progress_shard
              CHECK (shard >= 0 AND shard < 64)
        - sql:
            sql: >-
              ALTER TABLE station_import_progress
              ADD CONSTRAINT chk_station_import_progress_count
              CHECK (processed_stations >= 0)
