databaseChangeLog:
  - changeSet:
      id: 015-standardize-station-administrative-areas
      author: codex
      changes:
        - addColumn:
            tableName: station
            columns:
              - column: {name: locality_name, type: varchar(150)}
              - column: {name: normalized_locality_name, type: varchar(150)}
              - column: {name: admin_area_1_name, type: varchar(150)}
              - column: {name: admin_area_2_name, type: varchar(150)}
              - column: {name: admin_area_3_name, type: varchar(150)}
        - sql:
            sql: |
              UPDATE station
              SET locality_name = COALESCE(NULLIF(BTRIM(municipality), ''), locality),
                  normalized_locality_name = BTRIM(LOWER(REGEXP_REPLACE(
                    TRANSLATE(COALESCE(NULLIF(BTRIM(municipality), ''), locality, ''),
                              'áéíóúüñÁÉÍÓÚÜÑ', 'aeiouunAEIOUUN'),
                    '[^[:alnum:]]+', ' ', 'g'))),
                  admin_area_2_name = province
        - dropIndex: {tableName: station, indexName: idx_station_country_province_normalized}
        - dropIndex: {tableName: station, indexName: idx_station_country_municipality_normalized}
        - dropIndex: {tableName: station, indexName: idx_station_country_locality_search}
        - dropIndex: {tableName: station, indexName: idx_station_country_address_locality_search}
        - dropColumn: {tableName: station, columnName: locality}
        - dropColumn: {tableName: station, columnName: municipality}
        - dropColumn: {tableName: station, columnName: province}
        - createIndex:
            tableName: station
            indexName: idx_station_locality_hierarchy
            columns:
              - column: {name: country}
              - column: {name: normalized_locality_name}
              - column: {name: admin_area_1_name}
              - column: {name: admin_area_2_name}
              - column: {name: admin_area_3_name}
