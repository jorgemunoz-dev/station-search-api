databaseChangeLog:
  - changeSet:
      id: 012-create-snapshot-statistics
      author: codex
      changes:
        - addColumn:
            tableName: station_import
            columns:
              - column:
                  name: country
                  type: varchar(2)
        - addColumn:
            tableName: historical_product_price
            columns:
              - column:
                  name: snapshot_id
                  type: uuid
        - addForeignKeyConstraint:
            baseTableName: historical_product_price
            baseColumnNames: snapshot_id
            referencedTableName: station_import
            referencedColumnNames: snapshot_id
            constraintName: fk_historical_price_snapshot
            onDelete: CASCADE
        - createIndex:
            tableName: historical_product_price
            indexName: idx_historical_price_snapshot_product
            columns:
              - column: {name: snapshot_id}
              - column: {name: product_type}
              - column: {name: station_id}
        - createTable:
            tableName: administrative_area
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints: {primaryKey: true, nullable: false}
              - column:
                  name: country
                  type: varchar(2)
                  constraints: {nullable: false}
              - column:
                  name: source
                  type: varchar(50)
                  constraints: {nullable: false}
              - column:
                  name: external_code
                  type: varchar(255)
                  constraints: {nullable: false}
              - column:
                  name: type
                  type: varchar(100)
                  constraints: {nullable: false}
              - column:
                  name: name
                  type: varchar(255)
                  constraints: {nullable: false}
              - column:
                  name: normalized_name
                  type: varchar(255)
                  constraints: {nullable: false}
              - column: {name: parent_id, type: uuid}
        - addUniqueConstraint:
            tableName: administrative_area
            columnNames: country, source, external_code
            constraintName: uk_administrative_area_external
        - addForeignKeyConstraint:
            baseTableName: administrative_area
            baseColumnNames: parent_id
            referencedTableName: administrative_area
            referencedColumnNames: id
            constraintName: fk_administrative_area_parent
        - createIndex:
            tableName: administrative_area
            indexName: idx_administrative_area_hierarchy
            columns:
              - column: {name: country}
              - column: {name: parent_id}
              - column: {name: type}
              - column: {name: normalized_name}
        - createTable:
            tableName: station_administrative_area
            columns:
              - column:
                  name: station_id
                  type: uuid
                  constraints: {nullable: false}
              - column:
                  name: administrative_area_id
                  type: uuid
                  constraints: {nullable: false}
        - addPrimaryKey:
            tableName: station_administrative_area
            columnNames: station_id, administrative_area_id
            constraintName: pk_station_administrative_area
        - addForeignKeyConstraint:
            baseTableName: station_administrative_area
            baseColumnNames: station_id
            referencedTableName: station
            referencedColumnNames: id
            constraintName: fk_station_administrative_area_station
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: station_administrative_area
            baseColumnNames: administrative_area_id
            referencedTableName: administrative_area
            referencedColumnNames: id
            constraintName: fk_station_administrative_area_area
            onDelete: CASCADE
        - createIndex:
            tableName: station_administrative_area
            indexName: idx_station_administrative_area_area
            columns:
              - column: {name: administrative_area_id}
              - column: {name: station_id}
        - createTable:
            tableName: fuel_price_statistics
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: snapshot_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: varchar(2)
                  constraints:
                    nullable: false

              - column:
                  name: product_type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: administrative_area_id
                  type: uuid

              - column:
                  name: average_price
                  type: "numeric(12,6)"
                  constraints:
                    nullable: false

              - column:
                  name: minimum_price
                  type: "numeric(10,3)"
                  constraints:
                    nullable: false

              - column:
                  name: maximum_price
                  type: "numeric(10,3)"
                  constraints:
                    nullable: false

              - column:
                  name: station_count
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: cheapest_station_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: most_expensive_station_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: calculated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: fuel_price_statistics
            baseColumnNames: snapshot_id
            referencedTableName: station_import
            referencedColumnNames: snapshot_id
            constraintName: fk_statistics_snapshot
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: fuel_price_statistics
            baseColumnNames: administrative_area_id
            referencedTableName: administrative_area
            referencedColumnNames: id
            constraintName: fk_statistics_administrative_area
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uk_statistics_snapshot_national
              ON fuel_price_statistics (snapshot_id, country, product_type)
              WHERE administrative_area_id IS NULL
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uk_statistics_snapshot_area
              ON fuel_price_statistics (snapshot_id, country, product_type, administrative_area_id)
              WHERE administrative_area_id IS NOT NULL
        - createIndex:
            tableName: fuel_price_statistics
            indexName: idx_statistics_current_lookup
            columns:
              - column: {name: country}
              - column: {name: product_type}
              - column: {name: administrative_area_id}
              - column: {name: calculated_at, descending: true}
