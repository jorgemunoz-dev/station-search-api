databaseChangeLog:
  - changeSet:
      id: 012-create-snapshot-statistics
      author: codex
      changes:
        - addColumn:
            tableName: station_import
            columns:
              - column: {name: country, type: varchar(2)}
        - addColumn:
            tableName: historical_product_price
            columns:
              - column: {name: snapshot_id, type: uuid}
        - addForeignKeyConstraint:
            baseTableName: historical_product_price
            baseColumnNames: snapshot_id
            referencedTableName: station_import
            referencedColumnNames: snapshot_id
            constraintName: fk_historical_price_snapshot
            onDelete: CASCADE
        - createIndex:
            tableName: historical_product_price
            indexName: idx_historical_price_snapshot_product
            columns:
              - column: {name: snapshot_id}
              - column: {name: product_type}
              - column: {name: station_id}
        - createTable:
            tableName: fuel_price_statistics
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: {primaryKey: true, nullable: false}
              - column:
                  name: snapshot_id
                  type: uuid
                  constraints: {nullable: false}
              - column:
                  name: area_id
                  type: bigint
                  constraints: {nullable: false}
              - column:
                  name: product_type
                  type: varchar(50)
                  constraints: {nullable: false}
              - column:
                  name: average_price
                  type: "numeric(12,6)"
                  constraints: {nullable: false}
              - column:
                  name: minimum_price
                  type: "numeric(10,3)"
                  constraints: {nullable: false}
              - column:
                  name: maximum_price
                  type: "numeric(10,3)"
                  constraints: {nullable: false}
              - column:
                  name: station_count
                  type: bigint
                  constraints: {nullable: false}
              - column:
                  name: cheapest_station_id
                  type: uuid
                  constraints: {nullable: false}
              - column:
                  name: most_expensive_station_id
                  type: uuid
                  constraints: {nullable: false}
              - column:
                  name: calculated_at
                  type: timestamptz
                  constraints: {nullable: false}
        - addForeignKeyConstraint:
            baseTableName: fuel_price_statistics
            baseColumnNames: snapshot_id
            referencedTableName: station_import
            referencedColumnNames: snapshot_id
            constraintName: fk_statistics_snapshot
            onDelete: CASCADE
        - addForeignKeyConstraint: {baseTableName: fuel_price_statistics, baseColumnNames: area_id, referencedTableName: geographic_area, referencedColumnNames: id, constraintName: fk_statistics_area, onDelete: RESTRICT}
        - addForeignKeyConstraint: {baseTableName: fuel_price_statistics, baseColumnNames: cheapest_station_id, referencedTableName: station, referencedColumnNames: id, constraintName: fk_statistics_cheapest_station, onDelete: RESTRICT}
        - addForeignKeyConstraint: {baseTableName: fuel_price_statistics, baseColumnNames: most_expensive_station_id, referencedTableName: station, referencedColumnNames: id, constraintName: fk_statistics_most_expensive_station, onDelete: RESTRICT}
        - addUniqueConstraint: {tableName: fuel_price_statistics, columnNames: "snapshot_id, area_id, product_type", constraintName: uk_statistics_snapshot_area_product}
        - createIndex:
            tableName: fuel_price_statistics
            indexName: idx_statistics_current_lookup
            columns:
              - column: {name: area_id}
              - column: {name: product_type}
              - column: {name: calculated_at, descending: true}
