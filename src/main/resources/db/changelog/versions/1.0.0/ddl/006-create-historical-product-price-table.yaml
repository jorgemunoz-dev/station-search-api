databaseChangeLog:

  - changeSet:
      id: 006-create-historical-fuel-price-table
      author: jorge

      changes:

        - createTable:
            tableName: historical_product_price

            columns:

              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: station_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: product_type
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: numeric(10,3)
                  constraints:
                    nullable: false

              - column:
                  name: observed_at
                  type: timestamptz
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: historical_product_price
            baseColumnNames: station_id
            referencedTableName: station
            referencedColumnNames: id
            constraintName: fk_historical_price_station
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: historical_product_price
            columnNames: station_id, product_type, observed_at
            constraintName: uk_historical_product_price

        - createIndex:
            tableName: historical_product_price
            indexName: idx_historical_product_price_station_product_observed
            columns:
              - column:
                  name: station_id
              - column:
                  name: product_type
              - column:
                  name: observed_at
