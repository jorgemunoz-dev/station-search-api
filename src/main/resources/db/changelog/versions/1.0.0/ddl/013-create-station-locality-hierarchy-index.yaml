databaseChangeLog:
  - changeSet:
      id: 013-create-station-locality-hierarchy-index
      author: codex
      changes:
        - sql:
            sql: |
              CREATE INDEX idx_station_locality_hierarchy
              ON station (
                country,
                normalized_locality_name,
                admin_area_1_name,
                admin_area_2_name,
                admin_area_3_name
              );
