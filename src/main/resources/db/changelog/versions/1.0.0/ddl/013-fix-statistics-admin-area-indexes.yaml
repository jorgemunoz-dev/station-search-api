databaseChangeLog:
  - changeSet:
      id: 013-fix-statistics-admin-area-indexes
      author: codex
      changes:
        - sql:
            sql: >-
              DROP INDEX uk_statistics_snapshot_admin_area_1;
              CREATE UNIQUE INDEX uk_statistics_snapshot_admin_area_1
              ON fuel_price_statistics (snapshot_id, country, product_type, admin_area_1_name)
              WHERE normalized_locality_name IS NULL
                AND admin_area_1_name IS NOT NULL
                AND admin_area_2_name IS NULL
                AND admin_area_3_name IS NULL;
        - sql:
            sql: >-
              DROP INDEX uk_statistics_snapshot_admin_area_2;
              CREATE UNIQUE INDEX uk_statistics_snapshot_admin_area_2
              ON fuel_price_statistics (snapshot_id, country, product_type, admin_area_1_name, admin_area_2_name)
              WHERE normalized_locality_name IS NULL
                AND admin_area_1_name IS NOT NULL
                AND admin_area_2_name IS NOT NULL
                AND admin_area_3_name IS NULL;
        - sql:
            sql: >-
              DROP INDEX uk_statistics_snapshot_admin_area_3;
              CREATE UNIQUE INDEX uk_statistics_snapshot_admin_area_3
              ON fuel_price_statistics (snapshot_id, country, product_type, admin_area_1_name, admin_area_2_name, admin_area_3_name)
              WHERE normalized_locality_name IS NULL
                AND admin_area_1_name IS NOT NULL
                AND admin_area_2_name IS NOT NULL
                AND admin_area_3_name IS NOT NULL;
